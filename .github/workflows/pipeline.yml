name: pipeline

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [inbox]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-source refresh intervals"
        type: boolean
        default: false
      test_push:
        description: "Send one test push to the `test` topic"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  run:
    if: github.event_name != 'issues' || github.event.label.name == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      # GitHub disables a schedule after 60 days without repo activity; re-enabling the workflow resets that timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable" || echo "::warning::keep-alive call failed"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data branch
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C out; fi

      - name: Run pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-flash-latest' }}
          LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS || '25' }}
          LLM_MAX_SECONDS: ${{ vars.LLM_MAX_SECONDS || '480' }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://eventborg.eventborg-worker.workers.dev' }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline run --out out ${{ inputs.force && '--force' || '' }}

      - name: Publish data branch
        if: steps.pipeline.outputs.publish == 'true'
        working-directory: out
        run: |
          git init -q -b data
          git add -A
          git -c user.name="eventborg-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Acknowledge inbox items and reply
        if: steps.pipeline.outputs.ack == 'true' && steps.pipeline.outputs.publish == 'true'
        env:
          WORKER_URL: ${{ vars.WORKER_URL || 'https://eventborg.eventborg-worker.workers.dev' }}
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: python -m pipeline ack --out out

      - name: Send pushes
        if: steps.pipeline.outputs.push == 'true'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python -m pipeline push --out out

      - name: Test push
        if: inputs.test_push
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python -m pipeline push --out out --test
