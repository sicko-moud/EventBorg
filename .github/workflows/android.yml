name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GS" ]; then printf '%s' "$GS" > app/google-services.json; fi

      - run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK size
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          s=$(stat -c %s "$f")
          echo "Release APK: $((s / 1024)) KB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$s" -gt 8388608 ]; then echo "::error::APK is over the 8 MB hard cap"; exit 1; fi
          if [ "$s" -gt 6291456 ]; then echo "::warning::APK is over the 6 MB target"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: eventborg-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: eventborg-release
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/smoke.sh "$(ls apk/*.apk | head -1)" shots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-shots
          path: shots
          retention-days: 7
