name: android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GS" ]; then printf '%s' "$GS" > app/google-services.json; fi

      # Without the keystore secret (forks) the release build falls back to the debug key.
      - name: Release keystore
        env:
          KS: ${{ secrets.EB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::A release tag needs the EB_KEYSTORE_B64 secret"; exit 1
          fi

      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          EB_KEYSTORE_PASSWORD: ${{ secrets.EB_KEYSTORE_PASSWORD }}
          EB_KEY_ALIAS: ${{ secrets.EB_KEY_ALIAS }}
          EB_KEY_PASSWORD: ${{ secrets.EB_KEY_PASSWORD }}

      - name: APK size
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          s=$(stat -c %s "$f")
          echo "Release APK: $((s / 1024)) KB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$s" -gt 8388608 ]; then echo "::error::APK is over the 8 MB hard cap"; exit 1; fi
          if [ "$s" -gt 6291456 ]; then echo "::warning::APK is over the 6 MB target"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: eventborg-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eventborg-release
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv "$(ls apk/*.apk | head -1)" eventborg.apk
          sha256sum eventborg.apk > eventborg.apk.sha256
          gh release create "$GITHUB_REF_NAME" eventborg.apk eventborg.apk.sha256 -R "$GITHUB_REPOSITORY" \
            --title "EventBorg $GITHUB_REF_NAME" --generate-notes

  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: eventborg-release
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/smoke.sh "$(ls apk/*.apk | head -1)" shots

      - name: Timing
        if: always()
        run: if [ -f shots/timing.txt ]; then echo "Cold start (CI emulator): $(cat shots/timing.txt)" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-shots
          path: shots
          retention-days: 7
